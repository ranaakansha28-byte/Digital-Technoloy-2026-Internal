<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FITcheKK - Main</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone-container page2-container">

  <!-- =========================
     PROGRESS WIDGET
========================== -->

<section class="widget progress-widget">

    <img src="images/progress.png" alt="Progress background">

    <div class="widget-content">

        <h2>Progress</h2>

        <p class="average-title">
            Average hours or<br>
            minutes of exercise
        </p>

        <p id="monthlyAverage">Monthly average: 0 min</p>
        <p id="weeklyAverage">Weekly average: 0 min</p>
        <p id="dailyAverage">Daily average: 0 min</p>

        <div class="weekly-bars">

            <div class="day-bar">
                <div class="bar-track">
                    <div class="bar-fill" id="bar-monday"></div>
                </div>
                <span>Mon</span>
            </div>

            <div class="day-bar">
                <div class="bar-track">
                    <div class="bar-fill" id="bar-tuesday"></div>
                </div>
                <span>Tue</span>
            </div>

            <div class="day-bar">
                <div class="bar-track">
                    <div class="bar-fill" id="bar-wednesday"></div>
                </div>
                <span>Wed</span>
            </div>

            <div class="day-bar">
                <div class="bar-track">
                    <div class="bar-fill" id="bar-thursday"></div>
                </div>
                <span>Thu</span>
            </div>

            <div class="day-bar">
                <div class="bar-track">
                    <div class="bar-fill" id="bar-friday"></div>
                </div>
                <span>Fri</span>
            </div>

            <div class="day-bar">
                <div class="bar-track">
                    <div class="bar-fill" id="bar-saturday"></div>
                </div>
                <span>Sat</span>
            </div>

            <div class="day-bar">
                <div class="bar-track">
                    <div class="bar-fill" id="bar-sunday"></div>
                </div>
                <span>Sun</span>
            </div>

        </div>

    </div>

</section>


<!-- =========================
     EXERCISE WIDGET
========================== -->

<section class="widget exercise-widget">

    <img src="images/exercise.png" alt="Exercise background">

    <div class="widget-content">

        <div class="timer-label">
            <span>Timer</span>
            <span>mins</span>
        </div>

        <!-- Countdown appears ON TOP of image -->
        <div id="exerciseDisplay" class="timer-display">
            00:00
        </div>

        <button id="startExercise" class="main-timer-button">
            START
        </button>

        <div class="exercise-options">

            <button class="exercise-option" data-minutes="15">15</button>
            <button class="exercise-option" data-minutes="30">30</button>
            <button class="exercise-option" data-minutes="45">45</button>
            <button class="exercise-option" data-minutes="60">60</button>
            <button class="exercise-option" data-minutes="other">other</button>

        </div>

    </div>

</section>


<!-- =========================
     BREAK WIDGET
========================== -->

<section class="widget break-widget">

    <img src="images/break.png" alt="Break background">

    <div class="widget-content">

        <div class="timer-label">
            <span>Break Time</span>
            <span>mins</span>
        </div>

        <!-- Break countdown ON TOP of image -->
        <div id="breakDisplay" class="timer-display">
            00:00
        </div>

        <button id="stopBreak" class="break-control">
            STOP
        </button>

        <button id="resumeBreak" class="break-control">
            RESUME
        </button>

        <div class="break-options">

            <button class="break-option" data-break="5">5</button>
            <button class="break-option" data-break="10">10</button>
            <button class="break-option" data-break="15">15</button>
            <button class="break-option" data-break="20">20</button>
            <button class="break-option" data-break="30">30</button>

        </div>

    </div>

</section>



    <!-- =========================
         MOTIVATION
    ========================== -->

    <div class="motivation-message">
        Do You Think You Made Any Difference?
    </div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="bottom-navigation">

        <a href="index.html" class="nav-button">
            🏠
        </a>

        <a href="page3.html" class="nav-button">
            💡
        </a>

        <a href="page4.html" class="nav-button">
            👤
        </a>

        <a href="page3.html" class="nav-button">
            »
        </a>

    </nav>

</div>


<script src="script.js"></script>

</body>
</html>
