<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Activity Log</title>

    <!-- YOUR CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- =========================================
         PAGE 3 PHONE CONTAINER
    ========================================= -->

    <div class="page3-phone">


        <!-- =========================================
             MAIN PAGE 3 CONTENT
        ========================================= -->

        <main class="page3-content">


            <!-- =========================================
                 TOP IMAGE
            ========================================= -->

            <div class="page3-top-image">

                <img
                    src="Images/page3-top-image.jpg"
                    alt="Meditation"
                >

            </div>


            <!-- =========================================
                 TIPS SECTION
            ========================================= -->

            <section class="page3-tips-section">


                <h2 class="page3-tips-title">
                    SOME TIPS FOR MY LOVELIES
                </h2>


                <div class="page3-carousel">


                    <!-- LEFT ARROW -->

                    <button
                        type="button"
                        class="page3-arrow"
                        id="page3Previous"
                        aria-label="Previous tips"
                    >
                        &#8592;
                    </button>


                    <!-- THREE VISIBLE CARDS -->

                    <div class="page3-cards">


                        <!-- CARD 1 -->

                        <div class="page3-card">

                            <div class="page3-card-inner">


                                <div class="page3-card-front">

                                    <img
                                        src="Images/tip1.jpg"
                                        alt="Tip 1"
                                    >

                                </div>


                                <div class="page3-card-back">

                                    <h3>Stay Active</h3>

                                    <p>
                                        Keep your body moving
                                        throughout the day.
                                    </p>

                                </div>


                            </div>

                        </div>


                        <!-- CARD 2 -->

                        <div class="page3-card">

                            <div class="page3-card-inner">


                                <div class="page3-card-front">

                                    <img
                                        src="Images/tip2.jpg"
                                        alt="Tip 2"
                                    >

                                </div>


                                <div class="page3-card-back">

                                    <h3>Take Breaks</h3>

                                    <p>
                                        Give your body and mind
                                        time to recharge.
                                    </p>

                                </div>


                            </div>

                        </div>


                        <!-- CARD 3 -->

                        <div class="page3-card">

                            <div class="page3-card-inner">


                                <div class="page3-card-front">

                                    <img
                                        src="Images/tip3.jpg"
                                        alt="Tip 3"
                                    >

                                </div>


                                <div class="page3-card-back">

                                    <h3>Stay Consistent</h3>

                                    <p>
                                        Small amounts of exercise
                                        build healthy habits.
                                    </p>

                                </div>


                            </div>

                        </div>


                    </div>


                    <!-- RIGHT ARROW -->

                    <button
                        type="button"
                        class="page3-arrow"
                        id="page3Next"
                        aria-label="Next tips"
                    >
                        &#8594;
                    </button>


                </div>

            </section>


            <!-- =========================================
                 ACTIVITY LOG
            ========================================= -->

            <section class="page3-activity-section">


                <h2 class="page3-activity-title">
                    Activity LOG
                </h2>


                <div class="page3-activity-area">


                    <!-- TEXT BOX -->

                    <textarea
                        id="page3ActivityInput"
                        aria-label="Activity log"
                    ></textarea>


                    <!-- RUNNING PERSON -->

                    <img
                        src="Images/running-person.png"
                        alt="Running person"
                        class="page3-running-image"
                    >


                </div>


                <!-- SAVE BUTTON -->

                <button
                    type="button"
                    id="page3SaveButton"
                >
                    SAVE
                </button>


                <!-- SAVE MESSAGE -->

                <p id="page3SaveMessage"></p>


            </section>


        </main>
